<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publications · NeuraSec Research Group</title>
  <meta name="description" content="Peer-reviewed journal articles and conference papers by NeuraSec Research Group members." />
  <meta name="theme-color" content="#07122b" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="NeuraSec Research Group" />
  <meta property="og:title" content="Publications · NeuraSec Research Group" />
  <meta property="og:description" content="Peer-reviewed journal articles and conference papers by NeuraSec Research Group members." />
  <meta property="og:image" content="https://neurasec.github.io/NeuraSec/images/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="NeuraSec Research Group - Advancing AI Security and Intelligent Systems" />
  <meta property="og:locale" content="en_GB" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/neurasec.css" />
  <script src="js/theme-init.js"></script>
</head>
<body data-page="publications">

<header id="site-header"></header>

<main>
<section class="page-hero">
  <div class="container">
    <span class="eyebrow">Research output</span>
    <h1 class="page-hero__title">Publications</h1>
    <p class="page-hero__sub">Journal articles (J) and conference papers (C), numbered oldest first.</p>
    <div class="page-hero__facts"><span class="page-hero__fact"><b data-count="papers">–</b>papers in total</span><span class="page-hero__fact"><b data-count="peer">–</b>published or accepted</span><span class="page-hero__fact"><b data-count="pipeline">–</b>under review or submitted</span></div>
  </div>
</section>

<section class="section section--alt" aria-label="Publication list">
  <div class="container">
    <div class="toolbar" role="search">
      <div class="toolbar__row">
        <label class="search">
          <span class="sr-only">Search publications</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></g></svg>
          <input type="search" id="pubSearch" placeholder="Search title, author, venue or keyword…" autocomplete="off" />
        </label>
        <label class="sr-only" for="pubMember">Filter by member</label>
        <select class="select" id="pubMember"></select>
      </div>
      <div class="toolbar__row">
        <div class="chips" id="pubStatus" role="group" aria-label="Filter by status"></div>
        <span class="chips__sep" aria-hidden="true"></span>
        <div class="chips" id="pubType" role="group" aria-label="Filter by type"></div>
      </div>
    </div>
    <div class="result-row">
      <p class="result-note" id="pubNote" aria-live="polite"></p>
      <button type="button" class="pub__link" id="pubExport" title="Download the papers shown below as a .bib file"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg><span>Download BibTeX</span></button>
    </div>
    <div id="pubList"></div>
  </div>
</section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="data/members.js"></script>
<script src="data/publications.js"></script>
<script src="data/site.js"></script>
<script src="js/common.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
